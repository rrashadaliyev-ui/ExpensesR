<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Expense Manager</title>
  <meta name="description" content="Track, organise and analyse your expenses.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="manifest.json">
  <!-- APP VERSION: when you upload changes, bump every ?v=... below (same value everywhere) so phones load all new files together. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="alternate icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563eb'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>₼</text></svg>">
  <script>
    // Apply saved/system theme before first paint to avoid a flash.
    (function () { var d = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches; document.documentElement.dataset.theme = d ? 'dark' : 'light'; })();
  </script>
  <link rel="stylesheet" href="css/styles.css?v=20261124b">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="topbar">
    <button class="icon-btn" id="menu-toggle" aria-label="Open menu">☰</button>
    <a class="brand" href="#/dashboard"><span class="logo">₼</span><span>Expense Manager</span></a>
    <span class="spacer"></span>
    <button class="btn primary small" data-global-add>+ Add</button>
    <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
  </header>

  <aside class="sidebar" aria-label="Main navigation">
    <a class="brand" href="#/dashboard"><span class="logo">₼</span><span>Expense Manager</span></a>
    <button class="btn primary block" data-global-add>+ Add expense</button>
    <nav class="nav">
      <a href="#/dashboard"><span class="ni">📊</span>Dashboard</a>
      <a href="#/expenses"><span class="ni">🧾</span>Expenses</a>
      <a href="#/budget"><span class="ni">🐷</span>Budget &amp; Savings</a>
      <a href="#/debts"><span class="ni">🤝</span>Borrowed &amp; Lent</a>
      <a href="#/breakdown"><span class="ni">🧮</span>Breakdown</a>
      <a href="#/reports"><span class="ni">📈</span>Reports</a>
      <a href="#/categories"><span class="ni">🏷️</span>Categories</a>
      <a href="#/settings"><span class="ni">⚙️</span>Settings &amp; data</a>
    </nav>
    <div class="sidebar-foot">
      <div class="lang-switch" role="group" aria-label="Language"><button class="chip" data-lang="en">English</button><button class="chip" data-lang="az">Azərbaycan</button></div>
      <p class="muted small">Tip: press <kbd>N</kbd> to add an expense</p>
    </div>
  </aside>
  <div id="nav-scrim"></div>

  <main id="view" class="content" tabindex="-1">
    <div class="loading">Loading…</div>
  </main>
  <!-- Phone-only bottom navigation -->
  <nav class="tabbar" aria-label="Quick navigation">
    <a href="#/dashboard"><span class="ti">📊</span><small>Dashboard</small></a>
    <a href="#/expenses"><span class="ti">🧾</span><small>Expenses</small></a>
    <button class="tab-add" data-global-add aria-label="Add expense">＋</button>
    <a href="#/budget"><span class="ti">🐷</span><small>Budget</small></a>
    <button data-more><span class="ti">☰</span><small>More</small></button>
  </nav>
  <div id="toasts" aria-live="polite"></div>

  <!-- Libraries (charts + Excel). The app still works offline without them; only charts and .xlsx need them. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- App (order matters) -->
  <script src="js/utils.js?v=20261124b"></script>
  <script src="js/i18n.js?v=20261124b"></script>
  <script src="js/storage.js?v=20261124b"></script>
  <script src="js/firebase-config.js?v=20261124b"></script>
  <script src="js/storage-firebase.js?v=20261124b"></script>
  <script src="js/data.js?v=20261124b"></script>
  <script src="js/calc.js?v=20261124b"></script>
  <script src="js/ui.js?v=20261124b"></script>
  <script src="js/views/dashboard.js?v=20261124b"></script>
  <script src="js/views/expenses.js?v=20261124b"></script>
  <script src="js/views/budget.js?v=20261124b"></script>
  <script src="js/views/debts.js?v=20261124b"></script>
  <script src="js/views/breakdown.js?v=20261124b"></script>
  <script src="js/views/reports.js?v=20261124b"></script>
  <script src="js/views/categories.js?v=20261124b"></script>
  <script src="js/views/settings.js?v=20261124b"></script>
  <script src="js/app.js?v=20261124b"></script>
</body>
</html>
