<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Expense Manager</title>
  <meta name="description" content="Track, organise and analyse your expenses.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563eb'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>₼</text></svg>">
  <script>
    // Apply saved/system theme before first paint to avoid a flash.
    (function () { var d = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches; document.documentElement.dataset.theme = d ? 'dark' : 'light'; })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="topbar">
    <button class="icon-btn" id="menu-toggle" aria-label="Open menu">☰</button>
    <a class="brand" href="#/dashboard"><span class="logo">₼</span><span>Expense Manager</span></a>
    <span class="spacer"></span>
    <button class="btn primary small" data-global-add>+ Add</button>
    <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
  </header>

  <aside class="sidebar" aria-label="Main navigation">
    <a class="brand" href="#/dashboard"><span class="logo">₼</span><span>Expense Manager</span></a>
    <button class="btn primary block" data-global-add>+ Add expense</button>
    <nav class="nav">
      <a href="#/dashboard"><span class="ni">📊</span>Dashboard</a>
      <a href="#/expenses"><span class="ni">🧾</span>Expenses</a>
      <a href="#/breakdown"><span class="ni">🧮</span>Breakdown</a>
      <a href="#/reports"><span class="ni">📈</span>Reports</a>
      <a href="#/categories"><span class="ni">🏷️</span>Categories</a>
      <a href="#/settings"><span class="ni">⚙️</span>Settings &amp; data</a>
    </nav>
    <p class="sidebar-foot muted small">Tip: press <kbd>N</kbd> to add an expense</p>
  </aside>
  <div id="nav-scrim"></div>

  <main id="view" class="content" tabindex="-1">
    <div class="loading">Loading…</div>
  </main>
  <div id="toasts" aria-live="polite"></div>

  <!-- Libraries (charts + Excel). The app still works offline without them; only charts and .xlsx need them. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- App (order matters) -->
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/storage-firebase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/expenses.js"></script>
  <script src="js/views/breakdown.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/views/categories.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
